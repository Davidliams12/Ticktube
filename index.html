<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="ticktube.css">
    <link rel="icon" href="icon.jpg" type="image/jpeg">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>Tiktube | Smart Player</title>
</head>
<body>

<div id="search-results-page">
    <button class="btn-float-back" onclick="document.getElementById('search-results-page').style.display='none'"><i class="fas fa-arrow-left"></i> Back</button>
    <div style="max-width: 1400px; margin: 0 auto 20px;">
        <h2 id="search-title" style="color: var(--primary);">Search Results</h2>
    </div>
    <div id="results-grid" class="results-grid"></div>
</div>

<main id="main-scroll">
    <header>
        <div class="user-profile" style="display: flex; align-items: center;">
            <img id="profile-img" src="https://via.placeholder.com/35" style="width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--primary); cursor: pointer; margin-right: 12px; object-fit: cover;" onclick="document.getElementById('file-input').click()">
            <input type="file" id="file-input" style="display: none;" accept="image/*" onchange="changeProfilePic(event)">
            <div id="status-container" style="font-size: 13px; font-weight: bold; display: flex; align-items: center;">
                <span id="status-dot">⚙</span> <span id="status-text">CHECKING...</span>
            </div>
        </div>
        <button class="clear-btn-top" onclick="clearHistory()"><i class="fas fa-eraser"></i> Clear history</button>
    </header>

    <div class="search-row">
        <div class="search-wrapper">
            <div class="search-container">
                <input type="text" id="query" placeholder="Search movies or paste link..." autocomplete="off">
                <button class="btn-search" onclick="handleSearchAction()">Play/search</button>
            </div>
            <div id="suggestions"></div>
        </div>
    </div>

    <div class="content-body">
        <div class="layout-grid">
            <div class="player-area" id="player-anchor">
                <div class="video-card" id="main-video-card">
                    <div id="drag-handle">✥</div> 
                    <div id="pip-close" onclick="closePip()"><i class="fas fa-times"></i></div>
                    <div id="yt-player" class="active"></div>
                    <video id="local-video" controls></video>
                </div>
                <h2 id="now-playing-title" style="margin-top: 15px; font-size: 1.1rem;">Welcome to Tiktube</h2>
            </div>

            <div class="sidebars-container">
                <div id="up-next-sec" class="sidebar-section"><h3><i class="fas fa-forward-step"></i> Up Next</h3><div id="up-next-list" class="mini-list"></div></div>
                <div id="rec-sec" class="sidebar-section"><h3><i class="fas fa-fire"></i> Recommended</h3><div id="rec-list" class="mini-list"></div></div>
                <div id="hist-sec" class="sidebar-section"><h3><i class="fas fa-history"></i> History</h3><div id="history-list" class="mini-list"></div></div>
            </div>
        </div>
    </div>
    
    <footer>
        <p>Developed by <strong>David Liam's </strong></p>
        <a href="terms.html" class="footer-link">Terms of Service & Privacy Policy</a>
        <p style="font-size: 11px; opacity: 0.5; margin-top: 10px;">&copy; 2026 Tiktube</p>
    </footer>
    <div style="height: 100px;"></div>
</main>

<nav class="bottom-nav">
    <button class="nav-item" onclick="scrollToSection('up-next-sec')"><i class="fas fa-video"></i><span>Next</span></button>
    <button class="nav-item" onclick="scrollToSection('rec-sec')"><i class="fas fa-fire"></i><span>Hot</span></button>
    <button class="nav-item" onclick="scrollToSection('hist-sec')"><i class="fas fa-rectangle-list"></i><span>History</span></button>
    <button class="nav-item" onclick="window.open(document.getElementById('download-link').href, '_blank')"><i class="fas fa-download"></i><span>Download</span></button>
    <button class="nav-item" onclick="document.getElementById('file-upload').click()"><i class="fas fa-folder"></i><span>Local</span></button>
    <input type="file" id="file-upload" style="display: none;" accept="video/*" onchange="handleLocalVideo(event)">
    <a id="download-link" href="#" target="_blank" style="display:none;"></a>
</nav>
<script src="ticktube.js"></script>
</body>
</html>
